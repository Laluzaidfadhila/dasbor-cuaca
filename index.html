<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stasiun Observasi - Klasik</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Font Klasik & Analog -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@400;500;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-vintage: #e8e4D9;
            --bmkg-navy: #1A365D;
            --bmkg-gold: #D69E2E;
            --dial-face: #1a1a1a;
            --dial-text: #F7FAFC;
            --bezel-silver: #a0aec0;
            
            --classic-red: #C53030;
            --classic-blue: #2B6CB0;
            --classic-green: #2F855A;
        }

        body {
            font-family: 'Courier Prime', monospace;
            background-color: var(--bg-vintage);
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            width: 100%;
            background-color: var(--bmkg-navy);
            color: white;
            padding: 25px 0;
            text-align: center;
            border-bottom: 6px solid var(--bmkg-gold);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 0;
            color: var(--bmkg-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            color: #E2E8F0;
            letter-spacing: 5px;
            margin-top: 5px;
        }

        /* WADAH UTAMA */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
        }

        /* DASHBOARD DIALS */
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px;
            width: 100%;
        }

        .gauge-panel {
            background: var(--dial-face);
            border-radius: 50%;
            width: 280px;
            height: 280px;
            position: relative;
            border: 12px solid #cbd5e1;
            box-shadow: 
                inset 0 0 25px rgba(0,0,0,1), 
                0 15px 25px rgba(0,0,0,0.4),  
                0 0 0 2px #475569;            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gauge-panel::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        .tachometer {
            position: absolute;
            width: 240px;
            height: 240px;
            top: 20px;
        }

        .tachometer svg {
            width: 100%;
            height: 100%;
            transform: rotate(135deg);
        }

        .tacho-track {
            fill: none;
            stroke: #333;
            stroke-width: 12;
            stroke-linecap: butt;
            stroke-dasharray: 188.5 251.2;
        }

        .tacho-bar {
            fill: none;
            stroke-width: 12;
            stroke-linecap: butt;
            stroke-dasharray: 188.5 251.2;
            stroke-dashoffset: 188.5;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #panel-suhu .tacho-bar { stroke: var(--classic-red); }
        #panel-hum .tacho-bar { stroke: var(--classic-blue); }
        #panel-wet .tacho-bar { stroke: var(--classic-green); }

        .tacho-data {
            z-index: 10;
            text-align: center;
            margin-top: -20px;
        }

        .value-display {
            font-family: 'Oswald', sans-serif;
            font-size: 3.8rem;
            font-weight: 700;
            color: var(--dial-text);
            line-height: 1;
        }

        .unit {
            font-family: 'Courier Prime', monospace;
            font-size: 1rem;
            color: #a0aec0;
            margin-top: 5px;
            font-weight: bold;
        }

        .panel-label {
            position: absolute;
            bottom: 45px;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: #2d3748;
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid #4a5568;
        }

        /* PANEL EKSTREM (MAX/MIN) */
        .stats-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
            padding: 25px 40px;
            background: #2d3748; /* Warna logam gelap */
            border: 4px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            position: relative;
        }

        .stats-panel::before {
            content: 'REKAMAN EKSTREM (SESI AKTIF)';
            position: absolute;
            top: -12px;
            background: var(--bg-vintage);
            color: #333;
            padding: 0 10px;
            font-family: 'Oswald', sans-serif;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border: 1px solid #4a5568;
        }

        .stat-box {
            text-align: center;
            background: #1a202c; /* Latar belakang odometer */
            padding: 15px 30px;
            border: 3px inset #718096;
            min-width: 150px;
        }

        .stat-title {
            font-family: 'Oswald', sans-serif;
            color: #a0aec0;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        .stat-box .unit {
            font-size: 1.2rem;
            display: inline-block;
            margin-left: 5px;
        }

        #maxSuhuVal { color: var(--classic-red); }
        #minSuhuVal { color: var(--classic-blue); }

        /* STATUS KONEKSI */
        .footer-status {
            margin-top: 40px;
            margin-bottom: 40px;
            padding: 15px 30px;
            background-color: transparent;
            border: 2px solid var(--bmkg-navy);
            color: var(--bmkg-navy);
            text-align: center;
        }

        .connection {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
        }

        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #999;
            border: 2px solid #333;
        }

        .led.active {
            background-color: var(--classic-red);
            box-shadow: 0 0 8px var(--classic-red);
        }

        .timestamp {
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>STASIUN GEOFISIKA KELAS I DELI SERDANG</h1>
        <div class="subtitle">SANGKAR METEO DIGITAL BERBASIS IOT</div>
    </div>

    <div class="main-container">
        <div class="dashboard">
            
            <!-- DIAL SUHU -->
            <div class="gauge-panel" id="panel-suhu">
                <div class="tachometer">
                    <svg viewBox="0 0 100 100">
                        <circle class="tacho-track" cx="50" cy="50" r="40"></circle>
                        <circle class="tacho-bar" id="bar-suhu" cx="50" cy="50" r="40"></circle>
                    </svg>
                </div>
                <div class="tacho-data">
                    <div class="value-display"><span id="suhuVal">--</span></div>
                    <div class="unit">°C</div>
                </div>
                <div class="panel-label">BOLA KERING</div>
            </div>

            <!-- DIAL KELEMBAPAN -->
            <div class="gauge-panel" id="panel-hum">
                <div class="tachometer">
                    <svg viewBox="0 0 100 100">
                        <circle class="tacho-track" cx="50" cy="50" r="40"></circle>
                        <circle class="tacho-bar" id="bar-hum" cx="50" cy="50" r="40"></circle>
                    </svg>
                </div>
                <div class="tacho-data">
                    <div class="value-display"><span id="humVal">--</span></div>
                    <div class="unit">% RELATIF</div>
                </div>
                <div class="panel-label">KELEMBAPAN</div>
            </div>

            <!-- DIAL BOLA BASAH -->
            <div class="gauge-panel" id="panel-wet">
                <div class="tachometer">
                    <svg viewBox="0 0 100 100">
                        <circle class="tacho-track" cx="50" cy="50" r="40"></circle>
                        <circle class="tacho-bar" id="bar-wet" cx="50" cy="50" r="40"></circle>
                    </svg>
                </div>
                <div class="tacho-data">
                    <div class="value-display"><span id="wetVal">--</span></div>
                    <div class="unit">°C</div>
                </div>
                <div class="panel-label">BOLA BASAH</div>
            </div>
        </div>

        <!-- PANEL STATISTIK EKSTREM -->
        <div class="stats-panel">
            <div class="stat-box">
                <div class="stat-title">SUHU MAKSIMUM</div>
                <div><span class="stat-value" id="maxSuhuVal">--</span><span class="unit">°C</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-title">SUHU MINIMUM</div>
                <div><span class="stat-value" id="minSuhuVal">--</span><span class="unit">°C</span></div>
            </div>
        </div>
    </div>

    <div class="footer-status">
        <div class="connection">
            <div class="led" id="statusIndicator"></div>
            <span id="statusText">STATUS: MENUNGGU SINYAL RADIO...</span>
        </div>
        <div class="timestamp">PEMBARUAN TERAKHIR: <span id="timeVal">--:--:--</span></div>
    </div>

    <script>
        // ==========================================
        // 1. MASUKKAN API KEY FIREBASE ANDA DI SINI!
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBjH29bATrVn5vEVHFi1mgjwbe0jv5als8",
            databaseURL: "https://meteo-sangkar-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        function calculateWetBulb(t, rh) {
            if(rh < 0 || rh > 100 || isNaN(t) || isNaN(rh)) return null;
            let tw = t * Math.atan(0.151977 * Math.pow(rh + 8.313659, 0.5)) 
                   + Math.atan(t + rh) 
                   - Math.atan(rh - 1.676331) 
                   + 0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh) 
                   - 4.686035;
            return tw;
        }

        function updateTacho(barId, value, min, max) {
            const bar = document.getElementById(barId);
            if (!bar || isNaN(value)) return;
            let val = Math.max(min, Math.min(value, max));
            let percent = (val - min) / (max - min);
            let dashoffset = 188.5 - (percent * 188.5);
            bar.style.strokeDashoffset = dashoffset;
        }

        try {
            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();
            
            document.getElementById('statusText').innerText = "STATUS: MENGHUBUNGKAN KE SERVER...";
            const dbRef = database.ref('cuaca');

            let currentSuhu = null;
            let currentHum = null;
            
            // Variabel penyimpan rekor ekstrem
            let maxSuhu = -999;
            let minSuhu = 999;

            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                
                if (data) {
                    const led = document.getElementById('statusIndicator');
                    led.classList.add('active');
                    document.getElementById('statusText').innerText = "STATUS: TRANSMISI DATA AKTIF";
                    document.getElementById('timeVal').innerText = new Date().toLocaleTimeString('id-ID');

                    // --- Update Suhu Kering ---
                    if (data.suhu !== undefined) {
                        currentSuhu = data.suhu;
                        document.getElementById('suhuVal').innerText = currentSuhu.toFixed(1);
                        updateTacho('bar-suhu', currentSuhu, 0, 50);

                        // Logika Rekam Maksimum & Minimum
                        if (currentSuhu > maxSuhu) {
                            maxSuhu = currentSuhu;
                            document.getElementById('maxSuhuVal').innerText = maxSuhu.toFixed(1);
                        }
                        if (currentSuhu < minSuhu) {
                            minSuhu = currentSuhu;
                            document.getElementById('minSuhuVal').innerText = minSuhu.toFixed(1);
                        }
                    }

                    // --- Update Kelembapan ---
                    if (data.kelembapan !== undefined) {
                        currentHum = data.kelembapan;
                        document.getElementById('humVal').innerText = currentHum.toFixed(1);
                        updateTacho('bar-hum', currentHum, 0, 100);
                    }

                    // --- Update Suhu Basah ---
                    if (currentSuhu !== null && currentHum !== null) {
                        const wetBulb = calculateWetBulb(currentSuhu, currentHum);
                        if (wetBulb !== null) {
                            document.getElementById('wetVal').innerText = wetBulb.toFixed(1);
                            updateTacho('bar-wet', wetBulb, 0, 50);
                        }
                    }
                    
                    setTimeout(() => { led.classList.remove('active'); }, 600);
                }
            });
        } catch (error) {
            console.error("Error:", error);
            document.getElementById('statusText').innerText = "STATUS: GAGAL MENGHUBUNGKAN";
        }
    </script>
</body>
</html>
